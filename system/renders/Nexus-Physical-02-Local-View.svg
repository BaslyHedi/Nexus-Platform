<text x="272" y="174" font-size="13" font-weight="700" fill="#111827">FRDM board</text>
<rect x="948" y="147" width="42" height="14" rx="7" fill="#dcfce7" stroke="#15803d" stroke-width="0.8"/>
<text x="969.0" y="157.5" font-size="8.5" font-weight="700" text-anchor="middle" fill="#15803d">PHASE 1</text>
<circle cx="276.0" cy="198.5" r="1.8" fill="#7e22ce"/>
<text x="283.0" y="202" font-size="10.5" fill="#374151">FRDM-IMX91S (1.1)</text>
<circle cx="276.0" cy="214.5" r="1.8" fill="#7e22ce"/>
<text x="283.0" y="218" font-size="10.5" fill="#374151">TJA1051T/3, header J7: pin 8 CAN_H, pin 10 CAN_L</text>
<circle cx="276.0" cy="230.5" r="1.8" fill="#7e22ce"/>
<text x="283.0" y="234" font-size="10.5" fill="#374151">Termination R139 + R144 through JP1</text>
<circle cx="576.0" cy="198.5" r="1.8" fill="#7e22ce"/>
<text x="583.0" y="202" font-size="10.5" fill="#374151">Boot switch SW1 = 0011: SD card</text>
<circle cx="576.0" cy="214.5" r="1.8" fill="#7e22ce"/>
<text x="583.0" y="218" font-size="10.5" fill="#374151">USB-C J1: 5 V in, no power delivery</text>
<circle cx="576.0" cy="230.5" r="1.8" fill="#7e22ce"/>
<text x="583.0" y="234" font-size="10.5" fill="#374151">USB-C J11: UART console</text>
</g>
