<rect width="1640" height="960" fill="#fbfaf8"/>
<text x="30" y="40" font-size="22" font-weight="700" fill="#1a1a1a">Nexus-Physical-02 · FRDM Node · Local View</text>
<text x="30" y="62" font-size="11.5" fill="#555">The FRDM node as a system-of-interest: its elements, hardware and software, and the connections between them · requirements are allocated to these elements, never to the repositories that implement the software ones</text>
<text x="30" y="80" font-size="11.5" fill="#555">ID scheme <tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">Nexus-Physical-02-NN</tspan> · numbers in brackets are BOM items · board facts from the FRDM-IMX91S schematic SCH-95020 rev B</text>
<text x="1610" y="40" font-size="11" font-weight="700" fill="#b45309" text-anchor="end">DRAFT A · for review</text>
<text x="1610" y="58" font-size="10" fill="#777" text-anchor="end">2026-10-11</text>
<g transform="translate(0,14)">
<rect x="232" y="104" width="1146" height="626" rx="8" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2 3"/>
<text x="240" y="118" font-size="9" font-weight="700" fill="#9ca3af" letter-spacing="1">NEXUS-PHYSICAL-02 · FRDM NODE - BOUNDARY</text>
<rect x="30" y="140" width="170" height="70" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="115.0" y="171.0" font-size="12" font-weight="700" fill="#374151" text-anchor="middle">Vehicle CAN bus</text>
<text x="115.0" y="187.0" font-size="9.5" fill="#6b7280" text-anchor="middle">Nexus-Physical-04</text>
<rect x="30" y="222" width="170" height="70" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="115.0" y="253.0" font-size="12" font-weight="700" fill="#374151" text-anchor="middle">Bench PC</text>
<text x="115.0" y="269.0" font-size="9.5" fill="#6b7280" text-anchor="middle">enabling system, console</text>
<rect x="30" y="770" width="260" height="70" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="160.0" y="801.0" font-size="12" font-weight="700" fill="#374151" text-anchor="middle">Power supply and distribution</text>
<text x="160.0" y="817.0" font-size="9.5" fill="#6b7280" text-anchor="middle">Nexus-Physical-05</text>
