<circle cx="291.0" cy="453.5" r="1.8" fill="#7e22ce"/>
<text x="298.0" y="457" font-size="10.5" fill="#374151">BSP, kernel and device tree, root file system</text>
<circle cx="291.0" cy="469.5" r="1.8" fill="#7e22ce"/>
<text x="298.0" y="473" font-size="10.5" fill="#374151">Boots to a login prompt</text>
