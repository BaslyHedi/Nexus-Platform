<rect width="1640" height="960" fill="#fbfaf8"/>
<text x="30" y="40" font-size="22" font-weight="700" fill="#1a1a1a">Nexus-Physical-01 · STM32 Node · Local View</text>
<text x="30" y="62" font-size="11.5" fill="#555">The STM32 node as a system-of-interest: its elements, hardware and software, and the connections between them · requirements are allocated to these elements, never to the repositories that implement the software ones</text>
<text x="30" y="80" font-size="11.5" fill="#555">ID scheme <tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">Nexus-Physical-01-NN</tspan> · numbers in brackets are BOM items · the carrier wiring is owned by the stm32-carrier drawing (HW-19), the memory map by the bootloader</text>
<text x="1610" y="40" font-size="11" font-weight="700" fill="#b45309" text-anchor="end">DRAFT A · for review</text>
<text x="1610" y="58" font-size="10" fill="#777" text-anchor="end">2026-10-11</text>
