<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus Requirements Traceability</title>
<style>
:root{--bg:#f6f5f2;--panel:#ffffff;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--soft:#f3f4f6;--shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);--mix:white;--mixk:14%;--inkmix:0%;--hl:#f59e0b;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1115;--panel:#181b22;--ink:#e5e7eb;--muted:#9ca3af;--line:#2a2f3a;--soft:#222632;--shadow:0 1px 2px rgba(0,0,0,.5);--mix:#181b22;--mixk:30%;--inkmix:45%;--hl:#fbbf24;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1115;--panel:#181b22;--ink:#e5e7eb;--muted:#9ca3af;--line:#2a2f3a;--soft:#222632;--shadow:0 1px 2px rgba(0,0,0,.5);--mix:#181b22;--mixk:30%;--inkmix:45%;--hl:#fbbf24;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 16px}
h1{font-size:19px;margin:0}
.sub{color:var(--muted);font-size:12.5px;margin:2px 0 10px}
.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button,input,select{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 10px}
button{cursor:pointer}button:hover{background:var(--soft)}
input[type=search]{flex:1 1 220px;min-width:160px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.legend{display:flex;flex-wrap:wrap;gap:14px;align-items:center;color:var(--muted);font-size:12px;margin-top:8px}
.legend .b{pointer-events:none}
main{position:relative;overflow:auto;padding:16px}
#stage{position:relative;display:grid;grid-template-columns:repeat(3,minmax(300px,380px));column-gap:150px;min-width:1250px;width:max-content;margin:0 auto}
svg#links{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:0}
.col{position:relative;z-index:1}
.col h2{font-size:11px;letter-spacing:.08em;color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase}
.col h2 button{font-size:11px;padding:2px 8px}
.group{font-size:11px;color:var(--muted);margin:14px 0 4px;letter-spacing:.06em;text-transform:uppercase}
.card{--sys:#6b7280;position:relative;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--sys);border-radius:10px;box-shadow:var(--shadow);margin:0 0 12px}
.card>.head{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;background:color-mix(in srgb,var(--sys) var(--mixk),var(--mix));border-radius:9px 9px 0 0;cursor:pointer;user-select:none}
.card.closed>.head{border-radius:9px}
.chev{flex:none;width:16px;transition:transform .15s;color:var(--muted);margin-top:2px}
.card.closed .chev{transform:rotate(-90deg)}
.head .id{font:700 11.5px ui-monospace,Menlo,Consolas,monospace;color:color-mix(in srgb,var(--sys),white var(--inkmix))}
.head .name{font-weight:650;font-size:14px}
.head .meta{color:var(--muted);font-size:11.5px}
.bubbles{display:flex;flex-wrap:wrap;gap:6px;padding:10px}
.card.closed .bubbles{display:none}
.b{--sys:#6b7280;font:600 11.5px ui-monospace,Menlo,Consolas,monospace;border-radius:999px;padding:3px 9px;border:1.5px solid var(--sys);color:color-mix(in srgb,var(--sys),white var(--inkmix));background:var(--panel);cursor:pointer;line-height:1.3}
.b.der{background:color-mix(in srgb,var(--sys) var(--mixk),var(--mix))}
.b.asis{border-style:dashed}
.b:hover,.b:focus-visible{outline:2px solid var(--hl);outline-offset:1px}
.path{fill:none;stroke:color-mix(in srgb,var(--c),white var(--inkmix));stroke-width:1.2;opacity:.38;transition:opacity .15s}
.path.asis{stroke-dasharray:5 4;opacity:.6}
.focus .path{opacity:.06}.focus .path.on{opacity:1;stroke-width:2}
.focus .b{opacity:.25}.focus .b.on{opacity:1}.b.sel{outline:2.5px solid var(--hl);outline-offset:2px}
.filtering .b:not(.match){opacity:.18}.filtering .path{opacity:.05}
aside{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:-4px 0 18px rgba(0,0,0,.12);transform:translateX(105%);transition:transform .2s;z-index:10;overflow:auto;padding:18px 18px 40px}
aside.open{transform:none}
aside .close{position:absolute;top:12px;right:12px}
aside .rid{font:700 13px ui-monospace,Menlo,Consolas,monospace}
aside .sysname{font-size:12.5px;color:var(--muted);margin:2px 0 10px}
aside .stmt{font-size:15px;line-height:1.5;margin:8px 0 14px;padding:10px 12px;background:var(--soft);border-radius:8px}
aside table{border-collapse:collapse;font-size:13px;width:100%}
aside th{text-align:left;color:var(--muted);font-weight:600;padding:4px 10px 4px 0;vertical-align:top;white-space:nowrap}
aside td{padding:4px 0}
aside .b{margin:0 4px 4px 0}
.empty{color:var(--muted);font-size:12px}
@media (max-width:700px){header{padding:10px}h1{font-size:16px}}
</style></head><body>
<header>
  <h1>Nexus Requirements Traceability</h1>
  <div class="sub">%%SUB%%</div>
  <div class="controls">
    <button type="button" id="expand">Expand all</button><button type="button" id="collapse">Collapse all</button>
    <span class="sep"></span>
    <input type="search" id="filter" placeholder="Filter by ID or statement" aria-label="Filter requirements">
    <span class="sep"></span>
    <label for="theme" class="empty">Theme</label>
    <select id="theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select>
  </div>
  <div class="legend">
    <span><span class="b der" style="--sys:#6b7280">R001</span> derived below</span>
    <span><span class="b" style="--sys:#6b7280">R002</span> leaf, met here</span>
    <span><span class="b asis" style="--sys:#6b7280">R003</span> passed on as-is</span>
    <span>line: parent to child, in the parent's colour · dashed line: as-is allocation · click a bubble for its lineage and details</span>
  </div>
</header>
<main id="main"><div id="stage"><svg id="links" aria-hidden="true"></svg></div></main>
<aside id="panel" aria-live="polite"></aside>
<script id="data" type="application/json">%%DATA%%</script>
<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent), R=D.reqs, S=D.systems;
const stage=document.getElementById('stage'), svg=document.getElementById('links'), main=document.getElementById('main'), panel=document.getElementById('panel');
const NS='http://www.w3.org/2000/svg';
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e};
// theme
const themeSel=document.getElementById('theme');
let theme='auto';try{theme=localStorage.getItem('nexus-trace-theme')||'auto'}catch(e){}
const applyTheme=t=>{if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);themeSel.value=t;requestAnimationFrame(draw)};
themeSel.addEventListener('change',()=>{try{localStorage.setItem('nexus-trace-theme',themeSel.value)}catch(e){}applyTheme(themeSel.value)});
applyTheme(theme);
// build columns, cards, bubbles
const cards={}, bubbles={};
D.columns.forEach((col,ci)=>{
  const c=el('section','col');const h=el('h2');h.append(el('span','',col.title));
  const tb=el('button','', 'Fold');tb.type='button';tb.addEventListener('click',()=>{const ids=col.groups.flatMap(g=>g.systems);const anyOpen=ids.some(i=>!cards[i].classList.contains('closed'));ids.forEach(i=>cards[i].classList.toggle('closed',anyOpen));tb.textContent=anyOpen?'Unfold':'Fold';draw()});
  h.append(tb);c.append(h);
  col.groups.forEach(g=>{
    if(g.label)c.append(el('div','group',g.label));
    g.systems.forEach(sid=>{
      const s=S[sid];const card=el('div','card');card.id='card-'+sid;card.style.setProperty('--sys',s.colour);
      const head=el('div','head');head.setAttribute('role','button');head.tabIndex=0;head.setAttribute('aria-expanded','true');
      head.innerHTML='<svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';
      const t=el('div');t.append(el('div','id',sid),el('div','name',s.name),el('div','meta',s.within+' · '+s.reqs.length+' requirements'));head.append(t);
      const tog=()=>{card.classList.toggle('closed');head.setAttribute('aria-expanded',!card.classList.contains('closed'));draw()};
      head.addEventListener('click',tog);head.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tog()}});
      const bb=el('div','bubbles');
      s.reqs.forEach(rid=>{const q=R[rid];const b=el('button','b'+(q.der.length?' der':'')+(q.asis.length?' asis':''),rid.slice(-4));b.type='button';
        b.style.setProperty('--sys',s.colour);b.title=rid+': '+q.text;b.dataset.rid=rid;b.addEventListener('click',e=>{e.stopPropagation();select(rid)});bb.append(b);bubbles[rid]=b});
      card.append(head,bb);c.append(card);cards[sid]=card;
    });
  });
  stage.append(c);
});
// links
const paths=[];
Object.keys(R).sort().forEach(rid=>{const q=R[rid];
  q.kids.forEach(k=>paths.push({from:rid,to:k,asis:false,c:S[q.soi].colour}));
  q.asis.forEach(a=>paths.push({from:rid,toCard:a,asis:true,c:S[q.soi].colour}))});
paths.forEach(p=>{const e=document.createElementNS(NS,'path');e.setAttribute('class','path'+(p.asis?' asis':''));e.style.setProperty('--c',p.c);svg.append(e);p.el=e});
function anchor(rid,side){const sid=R[rid].soi, card=cards[sid];const t=card.classList.contains('closed')?card.querySelector('.head'):bubbles[rid];return box(t,side)}
function box(t,side){const r=t.getBoundingClientRect(), s=stage.getBoundingClientRect();return {x:(side==='r'?r.right:r.left)-s.left,y:r.top+r.height/2-s.top}}
function draw(){const s=stage.getBoundingClientRect();svg.setAttribute('width',s.width);svg.setAttribute('height',s.height);svg.setAttribute('viewBox','0 0 '+s.width+' '+s.height);
  paths.forEach(p=>{const a=anchor(p.from,'r');const b=p.asis?box(cards[p.toCard].querySelector('.head'),'l'):anchor(p.to,'l');const dx=Math.max(40,(b.x-a.x)/2);
    p.el.setAttribute('d','M'+a.x+','+a.y+' C'+(a.x+dx)+','+a.y+' '+(b.x-dx)+','+b.y+' '+b.x+','+b.y)})}
new ResizeObserver(draw).observe(stage);window.addEventListener('resize',draw);
// selection and lineage
function lineage(rid){const set=new Set([rid]);const up=r=>R[r].up.forEach(p=>{if(R[p]&&!set.has(p)){set.add(p);up(p)}});const down=r=>R[r].kids.forEach(k=>{if(!set.has(k)){set.add(k);down(k)}});up(rid);down(rid);return set}
let sel=null;
function select(rid){sel=rid;const L=lineage(rid);main.classList.add('focus');
  Object.entries(bubbles).forEach(([r,b])=>{b.classList.toggle('on',L.has(r));b.classList.toggle('sel',r===rid)});
  paths.forEach(p=>p.el.classList.toggle('on',L.has(p.from)&&(p.asis||L.has(p.to))));
  L.forEach(r=>{const c=cards[R[r].soi];if(c.classList.contains('closed')){c.classList.remove('closed')}});draw();show(rid);
  bubbles[rid].scrollIntoView({block:'nearest',inline:'nearest'})}
function clear(){sel=null;main.classList.remove('focus');Object.values(bubbles).forEach(b=>b.classList.remove('on','sel'));paths.forEach(p=>p.el.classList.remove('on'));panel.classList.remove('open')}
function chip(rid){const q=R[rid];const b=el('button','b'+(q.der.length?' der':'')+(q.asis.length?' asis':''),rid);b.type='button';b.style.setProperty('--sys',S[q.soi].colour);b.title=q.text;b.addEventListener('click',()=>select(rid));return b}
function sysChip(sid){const b=el('button','b',sid);b.type='button';b.style.setProperty('--sys',S[sid].colour);b.addEventListener('click',()=>{const c=cards[sid];c.classList.remove('closed');draw();c.scrollIntoView({block:'center',inline:'center'})});return b}
function show(rid){const q=R[rid], s=S[q.soi];panel.innerHTML='';panel.style.setProperty('--sys',s.colour);
  const x=el('button','close','Close');x.type='button';x.addEventListener('click',clear);panel.append(x);
  const id=el('div','rid',rid);id.style.color='color-mix(in srgb,'+s.colour+',white var(--inkmix))';panel.append(id,el('div','sysname',s.name+' · '+s.within),el('div','stmt',q.text));
  const t=el('table');const row=(k,v)=>{if(v==null||(Array.isArray(v)&&!v.length)||v==='')return;const tr=el('tr');tr.append(el('th','',k));const td=el('td');if(Array.isArray(v))v.forEach(n=>td.append(n));else td.textContent=v;tr.append(td);t.append(tr)};
  row('Need',q.need);row('Function',q.fn.join(', '));row('Derived from',q.up.filter(r=>R[r]).map(chip));
  row('Allocated to',q.der.map(sysChip));row('As-is to',q.asis.map(sysChip));row('Decomposed to',q.kids.map(chip));
  row('Phase',q.phase);if(q.ver.startsWith('Integration ')){const ids=q.ver.slice(12).split(',').map(x=>x.trim()).filter(x=>R[x]);row('Verification',[document.createTextNode('Integration of '),...ids.map(chip)])}else row('Verification',q.ver);row('Realised by',q.real);row('Decisions',q.dec);panel.append(t);panel.classList.add('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')clear()});
main.addEventListener('click',e=>{if(e.target===main||e.target===stage)clear()});
// expand, collapse, filter
document.getElementById('expand').addEventListener('click',()=>{Object.values(cards).forEach(c=>c.classList.remove('closed'));draw()});
document.getElementById('collapse').addEventListener('click',()=>{Object.values(cards).forEach(c=>c.classList.add('closed'));draw()});
document.getElementById('filter').addEventListener('input',e=>{const v=e.target.value.toLowerCase().trim();main.classList.toggle('filtering',!!v);
  Object.entries(bubbles).forEach(([r,b])=>{const hit=!!v&&(r.toLowerCase().includes(v)||R[r].text.toLowerCase().includes(v));b.classList.toggle('match',hit);if(hit)cards[R[r].soi].classList.remove('closed')});draw()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);requestAnimationFrame(draw);
if(location.hash&&R[location.hash.slice(1)])select(location.hash.slice(1));
})();
</script></body></html>
