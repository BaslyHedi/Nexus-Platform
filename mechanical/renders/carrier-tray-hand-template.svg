<text x="10" y="11" font-size="5" font-weight="700">NEXUS carrier tray - hand-made - 1:1 template (MEC-17)</text>
<text x="10" y="17" font-size="2.7" fill="#444">3 or 4 mm sheet, at least 189 x 116 mm. Top view, front of the vehicle to the LEFT, vehicle right at the TOP. Print at 100 %, no fit-to-page: the bar below must measure 100 mm.</text>
<text x="10" y="21.5" font-size="2.7" fill="#444">Centre-punch every cross, drill, then saw along the heavy line (12 straight cuts), file the edges, tap or countersink as the table says.</text>
