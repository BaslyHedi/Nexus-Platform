  <rect x="220" y="76" width="120" height="36" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6" rx="2"/>
  <text x="280" y="92" font-size="10" font-weight="700" fill="#7f1d1d" text-anchor="middle">MAIN FUSE 7.5 A</text>
  <text x="280" y="105" font-size="8.5" fill="#991b1b" text-anchor="middle">first in the chain</text>
  <!-- the module -->
  <rect x="420" y="160" width="370" height="270" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" rx="6"/>
  <text x="240" y="170" font-size="12" font-weight="700" fill="#7f1d1d">INA226 module</text>
  <text x="240" y="186" font-size="10" fill="#991b1b">GERUI, R002 · BOM 3.9</text>
  <text x="240" y="202" font-size="10" fill="#991b1b">terminals at the top,</text>
  <text x="240" y="216" font-size="10" fill="#991b1b">as in the vendor photo</text>
  <rect x="440" y="174" width="60" height="52" fill="#fdba74" stroke="#374151" stroke-width="1.2" rx="3"/>
  <circle cx="470" cy="200" r="13" fill="#e5e7eb" stroke="#374151" stroke-width="1.2"/>
