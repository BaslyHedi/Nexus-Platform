  <text x="110" y="137" font-size="10" fill="#4b5563" text-anchor="middle">9.0 - 12.6 V</text>
  <text x="172" y="106" font-size="12" font-weight="700" fill="#b91c1c">+</text>
  <line x1="110" y1="170" x2="110" y2="196" stroke="#111827" stroke-width="3"/>
  <text x="110" y="212" font-size="10" text-anchor="middle" fill="#1f2937">battery − → (−) bus</text>
