  <text x="518" y="894" font-size="10" fill="#374151">ground / V− sense</text>
  <line x1="700" y1="890" x2="730" y2="890" stroke="#7c3aed" stroke-width="2.2"/>
  <text x="738" y="894" font-size="10" fill="#374151">I²C</text>
