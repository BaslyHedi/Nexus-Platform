  <path d="M340 94 L462 94 A8 8 0 0 1 478 94 L560 94 L560 174" fill="none" stroke="#d92b2b" stroke-width="4"/>
  <text x="370" y="88" font-size="9.5" fill="#7f1d1d">fuse out → I+   (16-18 AWG)</text>
  <path d="M470 174 L470 66 L890 66 L890 80 L905 80" fill="none" stroke="#d92b2b" stroke-width="1.8"/>
  <text x="600" y="60" font-size="9.5" fill="#7f1d1d">V+ sense → (+) bus   (22 AWG or thicker, short)</text>
  <path d="M650 174 L650 120 L905 120" fill="none" stroke="#d92b2b" stroke-width="4"/>
  <text x="668" y="113" font-size="9.5" fill="#7f1d1d">I− → (+) bus   (16-18 AWG)</text>
  <path d="M740 174 L740 146 L840 146 L840 340 L860 340" fill="none" stroke="#111827" stroke-width="1.8"/>
  <text x="748" y="140" font-size="9.5" font-weight="700" fill="#111827">V− → (−) bus, never the + line</text>
  <!-- buses -->
  <text x="920" y="52" font-size="9.5" font-weight="700" fill="#b91c1c" text-anchor="middle">(+) WAGO BUS</text>
  <rect x="905" y="62" width="30" height="196" fill="#fecaca" stroke="#b91c1c" stroke-width="2" rx="3"/>
  <circle cx="920" cy="80" r="4" fill="#b91c1c"/>
  <text x="945" y="84" font-size="10" font-weight="700" fill="#7f1d1d">INA V+ sense   NEW</text>
  <circle cx="920" cy="120" r="4" fill="#b91c1c"/>
  <text x="945" y="124" font-size="10" font-weight="700" fill="#7f1d1d">INA I− out</text>
  <circle cx="920" cy="160" r="4" fill="#b91c1c"/>
  <text x="945" y="164" font-size="10" font-weight="400" fill="#6b7280">S8 switch feed → SW1, SW2</text>
  <circle cx="920" cy="200" r="4" fill="#b91c1c"/>
  <text x="945" y="204" font-size="10" font-weight="400" fill="#6b7280">spare</text>
  <circle cx="920" cy="240" r="4" fill="#b91c1c"/>
  <text x="945" y="244" font-size="10" font-weight="400" fill="#6b7280">spare</text>
  <text x="875" y="316" font-size="9.5" font-weight="700" fill="#111827" text-anchor="middle">(−) WAGO BUS</text>
  <rect x="860" y="322" width="30" height="196" fill="#e5e7eb" stroke="#111827" stroke-width="2" rx="3"/>
  <circle cx="875" cy="340" r="4" fill="#111827"/>
  <text x="900" y="344" font-size="10" font-weight="700" fill="#111827">INA V− (the spare port)   NEW</text>
  <circle cx="875" cy="380" r="4" fill="#111827"/>
  <text x="900" y="384" font-size="10" font-weight="400" fill="#6b7280">battery −</text>
  <circle cx="875" cy="420" r="4" fill="#111827"/>
  <text x="900" y="424" font-size="10" font-weight="400" fill="#6b7280">S4 motor driver −</text>
  <circle cx="875" cy="460" r="4" fill="#111827"/>
  <text x="900" y="464" font-size="10" font-weight="400" fill="#6b7280">S5 UBEC − and switch LEDs</text>
  <circle cx="875" cy="500" r="4" fill="#111827"/>
  <text x="900" y="504" font-size="10" font-weight="400" fill="#6b7280">S7 Bauer − (carrier GND via board C)</text>
  <!-- I2C lead to the carrier -->
  <rect x="470" y="560" width="280" height="86" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6" rx="3"/>
  <line x1="520" y1="410" x2="520" y2="574" stroke="#111827" stroke-width="2.2"/>
  <rect x="514" y="574" width="12" height="12" fill="#d4a017" stroke="#78350f" stroke-width="1"/>
  <text x="520" y="602" font-size="10" font-weight="700" text-anchor="middle" fill="#1f2937">GND</text>
  <text x="520" y="616" font-size="9" fill="#4b5563" text-anchor="middle">B·A7</text>
  <line x1="580" y1="410" x2="580" y2="574" stroke="#7c3aed" stroke-width="2.2"/>
  <rect x="574" y="574" width="12" height="12" fill="#d4a017" stroke="#78350f" stroke-width="1"/>
  <text x="580" y="602" font-size="10" font-weight="700" text-anchor="middle" fill="#1f2937">PB6</text>
  <text x="580" y="616" font-size="9" fill="#4b5563" text-anchor="middle">B·B7</text>
  <line x1="640" y1="410" x2="640" y2="574" stroke="#7c3aed" stroke-width="2.2"/>
  <rect x="634" y="574" width="12" height="12" fill="#d4a017" stroke="#78350f" stroke-width="1"/>
  <text x="640" y="602" font-size="10" font-weight="700" text-anchor="middle" fill="#1f2937">PB7</text>
  <text x="640" y="616" font-size="9" fill="#4b5563" text-anchor="middle">B·C7</text>
  <line x1="700" y1="410" x2="700" y2="574" stroke="#0891b2" stroke-width="2.2"/>
  <rect x="694" y="574" width="12" height="12" fill="#d4a017" stroke="#78350f" stroke-width="1"/>
  <text x="700" y="602" font-size="10" font-weight="700" text-anchor="middle" fill="#1f2937">3V3</text>
  <text x="700" y="616" font-size="9" fill="#4b5563" text-anchor="middle">B·D7</text>
  <text x="610" y="638" font-size="10" font-weight="700" fill="#4c1d95" text-anchor="middle">carrier board B, header I2C-A</text>
  <text x="470" y="664" font-size="9.5" fill="#4b5563">Pins drawn in matching order, not as placed: on the carrier I2C-A reads 3V3, SDA, SCL, GND left to right</text>
  <text x="470" y="678" font-size="9.5" fill="#4b5563">from above. Connect by NAME: GND to GND, SCL to SCL, SDA to SDA, VCC to 3V3. VCC is 3.3 V, never 5 V.</text>
  <path d="M750 600 L800 600 L800 500 L860 500" fill="none" stroke="#111827" stroke-width="1.4" stroke-dasharray="2 4"/>
  <text x="806" y="560" font-size="9" fill="#4b5563">carrier GND returns</text>
  <text x="806" y="572" font-size="9" fill="#4b5563">via 5V IN and board C</text>
  <text x="806" y="584" font-size="9" fill="#4b5563">(loop accepted, HW-19)</text>
  <!-- the fault -->
  <rect x="40" y="260" width="340" height="150" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6" rx="4"/>
  <text x="56" y="284" font-size="12" font-weight="700" fill="#9a3412">Fault found 2026-11-08</text>
  <text x="56" y="306" font-size="10.5" fill="#7c2d12" font-weight="400">V− had been landed on the + line. V− is the</text>
  <text x="56" y="322" font-size="10.5" fill="#7c2d12" font-weight="400">module's GND, so the INA GND, and through I2C-A</text>
  <text x="56" y="338" font-size="10.5" fill="#7c2d12" font-weight="400">the whole carrier ground, sat at battery +:</text>
  <text x="56" y="354" font-size="10.5" fill="#7c2d12" font-weight="400">13 V between the Bauer ground and every I²C pin.</text>
  <text x="56" y="370" font-size="10.5" fill="#7c2d12" font-weight="700">The only terminal that goes to ground is V−.</text>
  <text x="56" y="386" font-size="10.5" fill="#7c2d12" font-weight="700">The other three are all on the + side.</text>
  <!-- checks -->
  <text x="40" y="720" font-size="13" font-weight="700" fill="#1a1a1a">Before the first power-up: power OFF, meter on continuity</text>
  <line x1="40" y1="728" x2="1160" y2="728" stroke="#e2e8f0"/>
  <text x="40" y="752" font-size="11" font-weight="700" fill="#1f2937">INA GND pin</text>
  <text x="210" y="752" font-size="11" fill="#374151">↔  battery −</text>
  <text x="380" y="752" font-size="11" font-weight="700" fill="#15803d">beep</text>
  <text x="40" y="776" font-size="11" font-weight="700" fill="#1f2937">INA GND pin</text>
  <text x="210" y="776" font-size="11" fill="#374151">↔  battery +</text>
  <text x="380" y="776" font-size="11" font-weight="700" fill="#c2410c">NO beep</text>
  <text x="40" y="800" font-size="11" font-weight="700" fill="#1f2937">I+</text>
  <text x="210" y="800" font-size="11" fill="#374151">↔  main fuse output</text>
  <text x="380" y="800" font-size="11" font-weight="700" fill="#15803d">beep</text>
  <text x="40" y="824" font-size="11" font-weight="700" fill="#1f2937">I−</text>
  <text x="210" y="824" font-size="11" fill="#374151">↔  (+) bus</text>
  <text x="380" y="824" font-size="11" font-weight="700" fill="#15803d">beep</text>
  <text x="600" y="752" font-size="11" font-weight="700" fill="#1f2937">V+</text>
  <text x="770" y="752" font-size="11" fill="#374151">↔  (+) bus</text>
  <text x="940" y="752" font-size="11" font-weight="700" fill="#15803d">beep</text>
  <text x="600" y="776" font-size="11" font-weight="700" fill="#1f2937">V−</text>
  <text x="770" y="776" font-size="11" fill="#374151">↔  (−) bus</text>
  <text x="940" y="776" font-size="11" font-weight="700" fill="#15803d">beep</text>
  <text x="600" y="800" font-size="11" font-weight="700" fill="#1f2937">carrier I2C-A GND</text>
  <text x="770" y="800" font-size="11" fill="#374151">↔  battery +</text>
  <text x="940" y="800" font-size="11" font-weight="700" fill="#c2410c">NO beep</text>
  <text x="600" y="824" font-size="11" font-weight="700" fill="#1f2937">bare module: GND</text>
  <text x="770" y="824" font-size="11" fill="#374151">↔  V+, I+, I−</text>
  <text x="940" y="824" font-size="11" font-weight="700" fill="#c2410c">NO beep (V− beeps by design)</text>
