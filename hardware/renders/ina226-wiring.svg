  <text x="470" y="244" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">V+</text>
  <text x="470" y="258" font-size="8.5" fill="#4b5563" text-anchor="middle">bus voltage sense</text>
  <rect x="530" y="174" width="60" height="52" fill="#fdba74" stroke="#374151" stroke-width="1.2" rx="3"/>
  <circle cx="560" cy="200" r="13" fill="#e5e7eb" stroke="#374151" stroke-width="1.2"/>
