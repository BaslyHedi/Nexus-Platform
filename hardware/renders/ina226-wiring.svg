  <text x="40" y="48" font-size="11" fill="#666">HW-03 fuse before shunt · HW-07 high-side sensing · HW-20 three fuses · MEC-16 buses on plate 2 · I²C on carrier header I2C-A (HW-22, MEC-15)</text>
