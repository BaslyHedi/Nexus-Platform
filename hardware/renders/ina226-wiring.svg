  <text x="605" y="308" font-size="8.5" fill="#4b5563" text-anchor="middle">2 mΩ shunt</text>
  <rect x="590" y="322" width="70" height="34" fill="#111827" rx="2"/>
  <text x="625" y="343" font-size="10" font-weight="700" fill="#f9fafb" text-anchor="middle">INA226</text>
  <text x="440" y="340" font-size="9" fill="#4b5563">A0, A1 open</text>
  <text x="440" y="353" font-size="9" fill="#4b5563">→ address 0x40</text>
  <path d="M740 266 L740 372 L520 372 L520 392" fill="none" stroke="#111827" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="748" y="330" font-size="9.5" font-weight="700" fill="#111827">on the PCB:</text>
  <text x="748" y="343" font-size="9.5" font-weight="700" fill="#111827">V− IS GND</text>
  <rect x="514" y="398" width="12" height="12" fill="#d4a017" stroke="#78350f" stroke-width="1"/>
  <text x="520" y="392" font-size="9.5" font-weight="700" text-anchor="middle" fill="#1f2937">GND</text>
